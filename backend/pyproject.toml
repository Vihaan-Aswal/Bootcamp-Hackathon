[project]
name = "radix-talent-match-backend"
version = "0.1.0"
description = "RADIX Talent Match API: shared contract, parsing, provider adapter and scoring"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "email-validator>=2.2,<3",
    "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.27,<1",
    "ruff>=0.7,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
# Supplied converter, kept as received.
extend-exclude = ["scripts/build_company_skillsets.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
